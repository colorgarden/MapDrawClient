<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>MapDraw 工具栏</title>
<style>
  :root {
    --bg: #1b1b1f; --panel: #232329; --line: #34343c;
    --text: #e6e6ea; --dim: #9a9aa5; --accent: #4aa3ff; --ok: #55ff55; --warn: #ffd24a; --err: #ff5555;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font: 13px/1.45 "Microsoft YaHei", "Segoe UI", system-ui, sans-serif; user-select: none; }
  .wrap { padding: 8px 10px 12px; }
  .title { font-weight: 600; font-size: 13px; color: var(--accent); margin: 2px 0 6px; }
  .row { display: flex; gap: 6px; margin-bottom: 6px; }
  .row.wrap-row { flex-wrap: wrap; }
  button {
    flex: 1 1 auto; min-height: 26px; padding: 3px 8px; cursor: pointer;
    background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 4px; font: inherit;
  }
  button:hover { border-color: var(--accent); }
  button.on { background: #2b3a4d; border-color: var(--accent); color: #fff; }
  .slider { width: 100%; margin: 4px 0 10px; }
  .swatches { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; margin-bottom: 10px; }
  .sw { aspect-ratio: 1 / 1; border: 1px solid var(--line); border-radius: 3px; cursor: pointer; }
  .sw.on { outline: 2px solid var(--accent); outline-offset: 1px; }
  .status { margin-top: 8px; font-size: 12px; color: var(--dim); }
</style>
</head>
<body>
<div class="wrap">
  <div class="title">工具</div>
  <div class="row">
    <button id="tool-PEN" class="on">笔</button>
    <button id="tool-ERASER">擦</button>
    <button id="tool-PAINTBUCKET">桶</button>
    <button id="tool-NONE">无</button>
  </div>

  <div class="title">笔刷大小 <span id="brush-label" style="color:var(--text)">1 格</span></div>
  <input id="brush" class="slider" type="range" min="1" max="16" step="1" value="1">

  <div class="title">颜色</div>
  <div class="swatches" id="swatches"></div>

  <div class="title">操作</div>
  <div class="row wrap-row">
    <button id="act-undo">撤销</button>
    <button id="act-redo">重做</button>
    <button id="act-protect">保护</button>
    <button id="act-sync">同步</button>
    <button id="act-meta">元数据</button>
    <button id="act-new">新建</button>
  </div>

  <div class="status" id="status">就绪</div>
</div>

<script>
  // 16 色调色板（与插件一致：索引 = 字节值）
  const PALETTE = [
    [34, "#ffffff"], [58, "#f2f2f2"], [114, "#c0392b"], [82, "#ff9ad5"],
    [12, "#3f6fd8"], [23, "#4fc3f7"], [45, "#3fbf6f"], [56, "#8bd450"],
    [101, "#f1c40f"], [34 + 120, "#e67e22"], [77, "#7f5af0"], [90, "#c46bff"],
    [8, "#6b6b6b"], [0, "#000000"], [125, "#b07a5a"], [66, "#e8e0d0"]
  ];

  const state = { tool: "PEN", color: 34, brush: 1 };

  function send(type, payload) {
    const msg = JSON.stringify({ type, ...payload });
    // Graphene 的 Java↔JS 桥：具体全局函数名在第 2 步接入时按它的 API 调整
    if (window.graphene && typeof window.graphene.post === "function") {
      window.graphene.post(msg);
    } else {
      document.getElementById("status").textContent = "桥未连接：" + msg;
    }
  }

  // 工具
  for (const tool of ["PEN", "ERASER", "PAINTBUCKET", "NONE"]) {
    document.getElementById("tool-" + tool).addEventListener("click", () => {
      state.tool = tool;
      for (const t of ["PEN", "ERASER", "PAINTBUCKET", "NONE"]) {
        document.getElementById("tool-" + t).classList.toggle("on", t === tool);
      }
      send("tool", { tool });
    });
  }

  // 笔刷
  const brush = document.getElementById("brush");
  brush.addEventListener("input", () => {
    state.brush = parseInt(brush.value, 10);
    document.getElementById("brush-label").textContent = state.brush + " 格";
    send("brush", { size: state.brush });
  });

  // 色板
  const swatches = document.getElementById("swatches");
  PALETTE.forEach(([index, hex]) => {
    const d = document.createElement("div");
    d.className = "sw";
    d.style.background = hex;
    d.title = "#" + index;
    d.addEventListener("click", () => {
      state.color = index;
      [...swatches.children].forEach((c) => c.classList.remove("on"));
      d.classList.add("on");
      send("color", { index });
    });
    swatches.appendChild(d);
  });

  // 操作
  for (const act of ["undo", "redo", "protect", "sync", "meta", "new"]) {
    document.getElementById("act-" + act).addEventListener("click", () => send("action", { action: act }));
  }

  // 供 Java 调用：更新状态显示
  window.mapdraw = {
    setStatus(text) { document.getElementById("status").textContent = text; },
    setTool(tool) { document.getElementById("tool-" + tool)?.click(); },
    setColor(index) { [...swatches.children][index]?.click(); }
  };
</script>
</body>
</html>
