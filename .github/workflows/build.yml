name: build

# 每次 push / PR 都构建 settings.json 里的所有 Minecraft 版本（矩阵并行）
on: [pull_request, push]

jobs:
  matrix_prep:
    uses: ./.github/workflows/matrix_prep.yml

  build:
    needs: matrix_prep
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix_prep.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build ${{ matrix.subproject }}
        run: ./gradlew :${{ matrix.subproject }}:build --no-daemon
      - name: capture artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mapdrawclient-${{ matrix.subproject }}
          path: versions/${{ matrix.subproject }}/build/libs/*.jar
          if-no-files-found: error
